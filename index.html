<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App Starter</title>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen flex-col items-center justify-center p-6">

  <!-- Container Box -->
  <div class="w-full max-w-md rounded-2xl bg-slate-800 p-8 shadow-xl border border-slate-700 text-center">
    <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 mb-2">
      Hello Tailwind v4!
    </h1>
    <p class="text-slate-400 mb-6">
    </p>

    <!-- Vue Mounting point: This is where your Vue app will inject itself -->
    <div id="app" class="mb-6"></div>

    <button id="action-btn" class="cursor-pointer rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white shadow-md transition-all hover:bg-indigo-500 active:scale-95 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-500">
      Click Me
    </button>
  </div>

  <!-- Primary JavaScript entry point (Fixed Path) -->
  <script src="./main.js" type="module"></script>
</body>
</html>
